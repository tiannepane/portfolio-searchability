<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tianne — Portfolio</title>
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Geist+Pixel&family=Space+Grotesk:wght@700&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <div id="shared-nav"></div>

  <main class="home-layout">
    <nav class="rail" data-rail aria-label="Project categories">
      <ul class="rail-list">
        <li><button type="button" class="rail-item" data-category="CDW" aria-current="false">CDW</button></li>
        <li><button type="button" class="rail-item" data-category="Recollab" aria-current="false">Recollab</button></li>
        <li><button type="button" class="rail-item" data-category="Projects" aria-current="false">Projects</button></li>
        <li><button type="button" class="rail-item" data-category="Carbon 6" aria-current="false">Carbon 6</button></li>
      </ul>
    </nav>

    <div class="home-main">
      <div class="prompt-box-wrap" data-prompt-box-wrap>
        <form class="prompt-box" data-prompt-box>
          <label class="sr-only" for="prompt-input">Ask about a project</label>
          <input
            id="prompt-input"
            class="prompt-box-input"
            type="text"
            name="prompt"
            placeholder="Ask Tianne about a project…"
            autocomplete="off"
          />
          <button type="button" class="prompt-box-clear" data-prompt-box-clear hidden>Clear</button>
          <button type="submit" class="prompt-box-submit">Ask</button>
        </form>
        <p class="prompt-box-reply" data-prompt-box-reply hidden></p>
        <p class="sr-only" aria-live="polite" data-result-status></p>
      </div>

      <section class="bento-grid" data-grid aria-label="Projects">
        <!-- Cards rendered by js/home.js from data/projects.json -->
      </section>
    </div>
  </main>

  <script src="/js/shared-ui.js" defer></script>
  <script src="/js/chat.js" defer></script>
  <script src="/js/rail.js" defer></script>
  <script src="/js/home.js" defer></script>
</body>
</html>
