<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tianne — Portfolio</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/assets/images/favicon-48.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/assets/images/favicon-512.png" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/reset.css" />
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/typography-v2.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Geist+Pixel&family=Space+Grotesk:wght@700&display=swap"
    rel="stylesheet"
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <div id="shared-nav"></div>

  <main class="home-layout">
    <div class="home-main">
      <div class="prompt-box-wrap" data-prompt-box-wrap>
        <form class="prompt-box" data-prompt-box>
          <label class="sr-only" for="prompt-input">Ask about a project</label>
          <input
            id="prompt-input"
            class="prompt-box-input"
            type="text"
            name="prompt"
            placeholder="Ask Tianne about a project…"
            autocomplete="off"
          />
          <button type="button" class="prompt-box-clear" data-prompt-box-clear hidden>Clear</button>
          <button type="submit" class="prompt-box-submit">Ask</button>
        </form>
        <!-- Faded example questions (js/home.js); clicking one submits it. -->
        <ul class="prompt-suggestions" data-suggestions aria-label="Suggested questions"></ul>
        <p class="sr-only" aria-live="polite" data-result-status></p>
      </div>

      <section class="bento-grid" id="projects" data-grid aria-label="Projects">
        <p class="bento-empty" data-grid-empty hidden></p>
        <!-- Cards rendered by js/home.js into the two columns below, from
             data/projects.json filtered to js/home.js's HOME_COLUMNS. -->
        <div class="bento-grid-column" data-grid-column="left"></div>
        <div class="bento-grid-column" data-grid-column="right"></div>
      </section>
    </div>
  </main>

  <script src="/js/shared-ui.js" defer></script>
  <script src="/js/chat.js" defer></script>
  <script src="/js/home.js" defer></script>
</body>
</html>
